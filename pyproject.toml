[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsim-guard"
version = "0.1.0"
description = "Deterministic kinematic, torque, and ISO/TS 15066 energy firewall for World Models and VLA policies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.22.0",
    "matplotlib>=3.5.0"
]

[project.urls]
Homepage = "https://github.com/tsadi/worldsim-guard"

[tool.setuptools]
packages = ["worldsim_guard"]

[project.scripts]
worldsim-guard = "worldsim_guard.cli:main"
